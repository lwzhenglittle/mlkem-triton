[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-crypto-kernels"
version = "1.1.0"
description = "Cryptographic kernels in pure Triton: ML-KEM (FIPS 203), ML-DSA (FIPS 204), SLH-DSA (FIPS 205) and LMS/HSS (SP 800-208), on a shared layer of Keccak/sponge, SHA-2, parameterised NTT, prime-field and ChaCha20 primitives"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "triton-crypto-kernels contributors" }]
keywords = [
    "post-quantum",
    "pqc",
    "ml-kem",
    "ml-dsa",
    "kyber",
    "dilithium",
    "slh-dsa",
    "lms",
    "fips-203",
    "fips-204",
    "fips-205",
    "keccak",
    "shake",
    "chacha20",
    "symmetric",
    "ntt",
    "prime-field",
    "triton",
    "gpu",
    "intel",
    "gemm",
    "toeplitz",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Intended Audience :: Developers",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU :: Intel",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.4",
    "triton>=3.0",
]

[project.urls]
Homepage = "https://github.com/lwzhenglittle/triton-crypto-kernels"
Repository = "https://github.com/lwzhenglittle/triton-crypto-kernels"
Issues = "https://github.com/lwzhenglittle/triton-crypto-kernels/issues"
Changelog = "https://github.com/lwzhenglittle/triton-crypto-kernels/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# kyber-py is only used for random key-pair round-trip tests; the primary correctness
# gate is the NIST ACVP vectors, which do not need it.
ref = ["kyber-py>=1.0"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["triton_crypto*"]


[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
markers = [
    "slow: cases that take a long time to run",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs", "data", "build", "third_party", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line width is the formatter's job
    # The docs and comments deliberately use math/typographic characters that RUF001-003
    # consider ambiguous: ×, µ, ‖, Â, η, and the § section sign.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]        # generated parametrize cases are allowed a bare assert
# ML-DSA's dimensions are literally called k and l in FIPS 204; renaming them would make the
# code harder to check against the spec, so the "ambiguous name" rules are off for that package.
"triton_crypto/mldsa/*" = ["E741", "E743"]
"benchmarks/*" = ["E402"]   # sys.path first, import after: normal for a script
# Inside a Triton kernel `if CONST: ... else: ...` is a **compile-time** branch, far clearer
# than a conditional expression -- and a conditional expression lowers to two branches plus a
# select under jit. SIM108/SIM102 do not apply here.
"triton_crypto/mlkem/kernels/*" = ["SIM108", "SIM102"]
# Same reason in the parameterised NTT kernel: `if MONT: ... else: ...` selects an arithmetic
# path at compile time.
"triton_crypto/primitives/ntt/kernel.py" = ["SIM108"]
# Triton's frontend rejects starred unpacking ("unsupported AST node type: Starred"), so a
# tuple accumulator has to be written `x = x + (v,)`; RUF005's `(*x, v)` does not compile.
"triton_crypto/primitives/poseidon2.py" = ["RUF005"]
"triton_crypto/primitives/poly1305.py" = ["RUF005"]   # same Triton restriction
"triton_crypto/primitives/aes.py" = ["RUF005"]        # and here
"triton_crypto/primitives/blake3.py" = ["RUF005"]     # and here

[tool.ruff.format]
quote-style = "double"
