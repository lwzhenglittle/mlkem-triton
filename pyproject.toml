[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlkem-triton"
version = "0.1.0"
description = "ML-KEM (FIPS 203) keygen/encaps/decaps in pure Triton, replacing NTT with Toeplitz matrix multiplication on tensor cores"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "mlkem-triton contributors" }]
keywords = ["ml-kem", "post-quantum", "triton", "gpu", "gemm", "toeplitz", "ntt"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Intended Audience :: Developers",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU :: Intel",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.4",
    "triton>=3.0",
]

[project.optional-dependencies]
# kyber-py is only used for random key-pair round-trip tests; the primary correctness
# gate is the NIST ACVP vectors, which do not need it.
ref = ["kyber-py>=1.0"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["mlkem_triton*"]


[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
markers = [
    "slow: cases that take a long time to run",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs", "data", "build", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line width is the formatter's job
    # The docs and comments deliberately use math/typographic characters that RUF001-003
    # consider ambiguous: ×, µ, ‖, Â, η, and the § section sign.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]        # generated parametrize cases are allowed a bare assert
"benchmarks/*" = ["E402"]   # sys.path first, import after: normal for a script
# Inside a Triton kernel `if CONST: ... else: ...` is a **compile-time** branch, far clearer
# than a conditional expression -- and a conditional expression lowers to two branches plus a
# select under jit. SIM108/SIM102 do not apply here.
"mlkem_triton/kernels/*" = ["SIM108", "SIM102"]

[tool.ruff.format]
quote-style = "double"
